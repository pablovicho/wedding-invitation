name: Demo (data contoh) ke GitHub Pages

# OPSIONAL. Undangan asli di-deploy ke Cloudflare dari laptop (`npm run deploy`),
# karena data asli tidak ada di repo. Workflow ini hanya membangun DEMO dengan
# data contoh (src/config/wedding.config.example.ts), dijalankan manual dari tab Actions.
# Syarat: Settings -> Pages -> Source: "GitHub Actions".

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Otomatis: "/nama-repo" untuk project site, kosong untuk user site / custom domain
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
